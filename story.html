<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Câu chuyện tình yêu - Nam & Phương Anh</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">Nam & Phương Anh</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Trang chủ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="story.html">Câu chuyện</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="album.html">Album</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="info.html">Thông tin</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="invite.html">Thiệp mời</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="guestbook.html">Sổ lưu bút</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Header Section -->
    <section class="section" style="margin-top: 80px;">
        <div class="container">
            <h1 class="section-title">Câu chuyện tình yêu của chúng tôi</h1>
            <p class="section-subtitle">Hành trình từ lần đầu gặp gỡ đến ngày hạnh phúc nhất</p>
        </div>
    </section>

    <!-- Timeline Section -->
    <section class="section">
        <div class="container">
            <div class="timeline" id="timeline-container">
                <!-- Timeline items will be loaded here -->
                <div class="loading">
                    <div class="spinner-border" role="status">
                        <span class="visually-hidden">Đang tải...</span>
                    </div>
                    <p class="mt-3">Đang tải câu chuyện...</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; 2026 Nam & Phương Anh Wedding. Made with love.</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Main JS -->
    <script src="assets/js/main.js"></script>

    <!-- Page specific script -->
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            // Load config
            const config = await weddingApp.loadConfig();

            if (config && config.story_timeline) {
                const timelineContainer = document.getElementById('timeline-container');
                timelineContainer.innerHTML = '';

                config.story_timeline.forEach((item, index) => {
                    const timelineItem = document.createElement('div');
                    timelineItem.className = 'timeline-item fade-in';
                    timelineItem.style.animationDelay = `${index * 0.2}s`;

                    const formattedDate = weddingApp.formatDate(item.date);

                    timelineItem.innerHTML = `
                        <div class="timeline-content">
                            <h3>${item.title}</h3>
                            <p class="timeline-date">${formattedDate}</p>
                            <p>${item.description}</p>
                            ${item.image ? `<img src="${item.image}" alt="${item.title}" onerror="this.style.display='none'">` : ''}
                        </div>
                    `;

                    timelineContainer.appendChild(timelineItem);
                });
            }
        });
    </script>
</body>
</html>
