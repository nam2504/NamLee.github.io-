<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album ảnh - Nam & Phương Anh</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">Nam & Phương Anh</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Trang chủ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="story.html">Câu chuyện</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="album.html">Album</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="info.html">Thông tin</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="invite.html">Thiệp mời</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="guestbook.html">Sổ lưu bút</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Header Section -->
    <section class="section" style="margin-top: 80px;">
        <div class="container">
            <h1 class="section-title">Album ảnh cưới</h1>
            <p class="section-subtitle">Những khoảnh khắc đẹp nhất của chúng tôi</p>
        </div>
    </section>

    <!-- Gallery Section -->
    <section class="section">
        <div class="container">
            <div class="album-grid" id="album-grid">
                <!-- Gallery items will be loaded here -->
                <div class="loading">
                    <div class="spinner-border" role="status">
                        <span class="visually-hidden">Đang tải...</span>
                    </div>
                    <p class="mt-3">Đang tải album...</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; 2026 Nam & Phương Anh Wedding. Made with love.</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Main JS -->
    <script src="assets/js/main.js"></script>

    <!-- Page specific script -->
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            // Load config
            const config = await weddingApp.loadConfig();

            if (config && config.album_images) {
                const albumGrid = document.getElementById('album-grid');
                albumGrid.innerHTML = '';

                config.album_images.forEach((imagePath, index) => {
                    const albumItem = document.createElement('div');
                    albumItem.className = 'album-item fade-in';
                    albumItem.style.animationDelay = `${index * 0.1}s`;

                    albumItem.innerHTML = `
                        <img src="${imagePath}" alt="Wedding Photo ${index + 1}" onerror="this.parentElement.style.display='none'">
                    `;

                    albumGrid.appendChild(albumItem);
                });

                // Initialize lightbox after images are loaded
                setTimeout(() => {
                    weddingApp.initLightbox();
                }, 500);
            }
        });
    </script>
</body>
</html>
